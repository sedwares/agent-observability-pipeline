description = "Lightweight, dependency-free instrumentation for LLM/agent calls — latency, tokens, cost, success/failure as JSON Lines."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
packages = ["agentobs"]
