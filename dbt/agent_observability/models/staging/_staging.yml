version: 2

models:
  - name: stg_agent_events
    description: >
      One row per tracked LLM/agent call, cleaned and typed. Nulls in
      client_id/agent_name (calls made without that context) are coalesced
      to 'unknown' rather than dropped, since a call still costs money and
      should still show up in totals.
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: task_type
        tests: [not_null]
      - name: model
        tests: [not_null]
      - name: success
        tests: [not_null]
